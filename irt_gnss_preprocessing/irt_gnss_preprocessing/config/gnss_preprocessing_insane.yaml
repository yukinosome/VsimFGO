---
/irt_gnss_preprocessing/irt_gnss_preprocessing:
    ros__parameters:
        use_sim_time: true
        GNSSPreprocessor:
            gnss_receiver_handler:           'NovatelOEM7'
            NLOSCSVFilePath:                 ""
            publish_gnss_obs:                true
            user_estimation_from_topic:      true
            default_buffer_size:             10
            buffer_size:                     [10]
            enable_gnss_merge:               false

            # INSANE CSV conversion only provides NovAtel-like solution topics:
            # BESTPOS, BESTVEL, DUALANTENNAHEADING, and optionally CLOCKMODEL.
            # It does not provide RANGE, RANGE_AUX, RTCM, or ephemeris topics.
            enable_dual_antenna_dd:          false
            enable_rtcm_dd:                  false

            print_info_duration:             1.
            msg_lower_bound:                 80000000
            range_sync_queue_size:           10
            solution_sync_queue_size:        20

            # The converter publishes the raw RTK2-RTK1 baseline heading by
            # default. INSANE calibration gives this baseline as -135 deg in
            # the PX4 IMU/body frame, so adding +135 deg maps it to body yaw.
            antenna_heading_offset:          135.

        CommonGNSSParameters:
            enable_galileo_timebase:         false
            enable_differential_correction:  false
            enable_tropospheric_correction:  false
            enable_ionospheric_correction:   false
            enable_SatPosVel_calculation:    false
            enable_WL_correction:            false
            elevation_mask:                  15.
            ggto_sync_mode:                  0
            use_mode_switch_logic:           false

        CommonGPSParameters:
            enable: true
            enable_l1: true
            enable_l2: false

        CommonGalileoParameters:
            enable: false
            enable_e1: false
            enable_e5: false
            enable_e5a: false
            enable_e5b: false

        CommonGateParameters:
            enable: false
            prn_flags: [ 0., 0., 0., 0., 0., 0., 0., 0., 0. ]

        DDRTCMGNSSParameters:
            enable_galileo_timebase: false
            enable_differential_correction: false
            enable_tropospheric_correction: false
            enable_ionospheric_correction: false
            enable_SatPosVel_calculation: false
            enable_WL_correction: false
            elevation_mask: 15.
            ggto_sync_mode: 1
            use_mode_switch_logic: false

        DDRTCMGPSParameters:
            enable: false
            enable_l1: false
            enable_l2: false

        DDRTCMGalileoParameters:
            enable: false
            enable_e1: false
            enable_e5: false
            enable_e5a: false
            enable_e5b: false

        DDRTCMGateParameters:
            enable: false
            prn_flags: [ 0., 0., 0., 0., 0., 0., 0., 0., 0. ]

        DDDualAntennaGNSSParameters:
            enable_galileo_timebase: false
            enable_differential_correction: false
            enable_tropospheric_correction: false
            enable_ionospheric_correction: false
            enable_SatPosVel_calculation: false
            enable_WL_correction: false
            elevation_mask: 15.
            ggto_sync_mode: 1
            use_mode_switch_logic: false

        DDDualAntennaGPSParameters:
            enable: false
            enable_l1: false
            enable_l2: false

        DDDualAntennaGalileoParameters:
            enable: false
            enable_e1: false
            enable_e5: false
            enable_e5a: false
            enable_e5b: false

        DDDualAntennaGateParameters:
            enable: false
            prn_flags: [ 0., 0., 0., 0., 0., 0., 0., 0., 0. ]

        IntegrityParametersCommon:
            enable:                          false
            enable_gnss_exclusion:           false
            enable_imu_exclusion:            false
            enable_dvl_exclusion:            false

        RAIMParameters:
            hal:                             25
            p_fa:                            0.000006
            p_md:                            0.001
            p_bayes_threshold:               1.
            tta:                             0.
            tte:                             1.
            max_num_obs:                     40
            num_var:                         4
            max_num_to_identify_onde:        1
            variance_mode:                   1
